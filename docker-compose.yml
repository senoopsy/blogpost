version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: tech-news-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - tech-news-network
    environment:
      MONGO_INITDB_DATABASE: tech_news_aggregator

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tech-news-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: tech_news_aggregator
      RSS_UPDATE_INTERVAL_MINUTES: 15
      USE_AI_SUMMARY: ${USE_AI_SUMMARY:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama3-8b-8192}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    networks:
      - tech-news-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tech-news-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - tech-news-network

volumes:
  mongodb_data:
    driver: local

networks:
  tech-news-network:
    driver: bridge